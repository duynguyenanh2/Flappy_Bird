<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4ec0ca">
  <title>Flappy Penguin - Telegram Stars Game</title>
  <!-- SDK Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at top, #1f3b57 0%, #0e1a29 70%);
      color: #fff;
      font-family: "Baloo 2", "Arial Black", system-ui, sans-serif;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #stage {
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      cursor: pointer;
    }
    @media (min-width: 600px) { #stage { border-radius: 14px; } }
    canvas { display: block; width: 100%; height: 100%; }

    .hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px 4px 6px;
      border-radius: 999px;
      background: rgba(20, 30, 50, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(4px);
      font-size: 18px;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }
    .pill svg { width: 22px; height: 22px; filter: drop-shadow(0 1px 0 rgba(0,0,0,.35)); }
    .pill.bump { animation: bump 0.35s ease; }
    @keyframes bump { 40% { transform: scale(1.25); } }
    .icon-btn {
      pointer-events: auto;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      background: rgba(20, 30, 50, 0.55);
      color: #fff;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .icon-btn svg { width: 20px; height: 20px; }

    /* Overlay Game Over & Paywall */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      padding: 16px;
      background: rgba(10, 20, 35, 0.4);
      backdrop-filter: blur(2px);
      opacity: 0; visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s;
      cursor: default;
    }
    .overlay.show { opacity: 1; visibility: visible; }
    .go-title {
      font-size: 40px;
      letter-spacing: 1px;
      color: #ff9f1c;
      -webkit-text-stroke: 2px #fff;
      paint-order: stroke fill;
      text-shadow: 0 4px 0 #6b3b0e, 0 0 0 #000;
      filter: drop-shadow(0 3px 0 #3b2412);
      transform: translateY(-30px); opacity: 0;
      text-align: center;
    }
    .overlay.show .go-title { animation: drop 0.45s 0.05s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes drop { to { transform: translateY(0); opacity: 1; } }

    .panel {
      width: min(260px, 90%);
      background: #ded895;
      border: 3px solid #543847;
      border-radius: 12px;
      box-shadow: inset 0 0 0 3px #f6f1c7, 0 5px 0 #543847;
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      color: #e86a17;
      transform: translateY(60px); opacity: 0;
    }
    .overlay.show .panel { animation: rise 0.45s 0.25s cubic-bezier(.2,1.3,.4,1) forwards; }
    @keyframes rise { to { transform: translateY(0); opacity: 1; } }
    .label { font-size: 13px; color: #e86a17; letter-spacing: 0.5px; }
    .medal-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .medal {
      width: 52px; height: 52px; border-radius: 50%;
      background: #cfc77a;
      border: 3px dashed #b9b066;
      position: relative;
    }
    .medal[data-tier] { border-style: solid; }
    .medal[data-tier]::after {
      content: ""; position: absolute; top: 7px; left: 9px; width: 14px; height: 8px;
      border-radius: 50%; background: rgba(255,255,255,0.75); transform: rotate(-30deg);
    }
    .medal[data-tier="bronze"]   { background: radial-gradient(circle at 35% 30%, #f3b37a, #b5652a 70%); border-color: #7a3f12; }
    .medal[data-tier="silver"]   { background: radial-gradient(circle at 35% 30%, #ffffff, #a9b4c2 70%); border-color: #6b7685; }
    .medal[data-tier="gold"]     { background: radial-gradient(circle at 35% 30%, #fff1a8, #e3a700 70%); border-color: #9a6a00; }
    .medal[data-tier="platinum"] { background: radial-gradient(circle at 35% 30%, #ffffff, #9fe3f0 70%); border-color: #3c8fa3; }
    .scores { text-align: right; display: flex; flex-direction: column; gap: 2px; }
    .num {
      font-size: 30px; line-height: 1;
      color: #fff;
      -webkit-text-stroke: 1.5px #3b2412;
      paint-order: stroke fill;
      text-shadow: 0 2px 0 #3b2412;
    }
    .new {
      display: inline-block; font-size: 11px; color: #fff; background: #e63946;
      border-radius: 4px; padding: 1px 5px; margin-right: 6px; vertical-align: middle;
      -webkit-text-stroke: 0; text-shadow: none;
    }
    .new[hidden] { display: none; }
    .earned {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 14px; color: #fff; text-align: center; max-width: 260px; line-height: 1.3;
      text-shadow: 0 2px 0 rgba(0,0,0,0.4);
      opacity: 0;
    }
    .overlay.show .earned { animation: fade 0.4s 0.6s forwards; }
    .btns { display: flex; flex-direction: column; gap: 10px; width: min(260px, 90%); opacity: 0; }
    .overlay.show .btns { animation: fade 0.4s 0.7s forwards; }
    @keyframes fade { to { opacity: 1; } }

    .btn {
      font-family: inherit;
      font-size: 20px;
      letter-spacing: 0.5px;
      color: #fff;
      border: 3px solid #543847;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      text-shadow: 0 2px 0 rgba(0,0,0,0.3);
      box-shadow: 0 5px 0 #543847;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #543847; }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .btn-play { background: linear-gradient(#7ee04a, #48a81c); }
    .btn-star { background: linear-gradient(#f5b32f, #d17f1a); font-size: 18px; }
    .btn-star svg { width: 22px; height: 22px; }
    .btn[hidden], .pill[hidden], .panel[hidden], .earned:empty { display: none; }
    .btn[disabled] { filter: grayscale(0.5) brightness(0.9); cursor: progress; }

    .toast {
      position: absolute; left: 50%; bottom: 120px;
      transform: translateX(-50%) translateY(10px);
      background: rgba(15, 25, 40, 0.95);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 10px 16px; border-radius: 12px;
      font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600;
      opacity: 0; transition: all 0.25s ease; pointer-events: none;
      white-space: nowrap; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffa600"/>
    </linearGradient>
    <symbol id="star" viewBox="0 0 24 24">
      <path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.8z"
            fill="url(#starGrad)" stroke="#b86b00" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<main id="stage" aria-label="Trò chơi Flappy Penguin">
  <h1 class="sr-only">Flappy Penguin</h1>
  <canvas id="game" aria-label="Chạm hoặc nhấn phím Space để chim cánh cụt bay lên"></canvas>

  <div class="hud">
    <div class="pill" id="credit-pill" aria-live="polite" hidden>
      <svg aria-hidden="true"><use href="#star"/></svg>
      <span id="credit-text">0 lượt</span>
    </div>
    <span></span>
    <button class="icon-btn" id="mute-btn" type="button" aria-label="Tắt âm thanh">
      <svg id="icon-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      <svg id="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    </button>
  </div>

  <section id="over" class="overlay" aria-live="assertive" aria-hidden="true">
    <h2 class="go-title" id="over-title">GAME OVER</h2>
    <div class="panel" id="score-panel">
      <div class="medal-wrap">
        <span class="label">HUY CHƯƠNG</span>
        <div class="medal" id="medal" role="img" aria-label="Chưa có huy chương"></div>
      </div>
      <div class="scores">
        <span class="label">ĐIỂM</span>
        <span class="num" id="final-score">0</span>
        <span class="label">KỶ LỤC</span>
        <span class="num"><span class="new" id="new-badge" hidden>MỚI</span><span id="best-score">0</span></span>
      </div>
    </div>
    <p class="earned" id="price-note"></p>
    <div class="btns">
      <button class="btn btn-play" id="restart-btn" type="button">Chơi lại</button>
      <button class="btn btn-star" id="pay-btn" type="button" hidden>
        Mua lượt · <span id="pay-price">10</span>
        <svg aria-hidden="true"><use href="#star"/></svg>
        Stars
      </button>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>
</main>

<script>
(() => {
  // ===== Khởi tạo Telegram SDK =====
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#4ec0ca'); tg.setBackgroundColor('#0e1a29'); } catch (e) {}
    try { tg.disableVerticalSwipes?.(); } catch (e) {}
  }
  const haptic = (type) => {
    try {
      if (!tg?.HapticFeedback) return;
      if (type === 'error' || type === 'success') tg.HapticFeedback.notificationOccurred(type);
      else tg.HapticFeedback.impactOccurred(type);
    } catch (e) {}
  };

  const initData = tg?.initData || '';
  const inTelegram = Boolean(initData);

  // Hàm gọi API backend
  async function api(action, extra = {}) {
    try {
      const res = await fetch('/api/telegram', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, initData, ...extra }),
      });
      const data = await res.json().catch(() => ({}));
      return { status: res.status, data };
    } catch (e) {
      // Giả lập dữ liệu nếu chạy Web ngoài (Demo mode không có backend Next.js)
      return {
        status: 200,
        data: { ok: true, credits: 0, freeAvailable: true, price: 10, nextPrice: 20 }
      };
    }
  }

  // ===== DOM =====
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overEl = document.getElementById('over');
  const finalScoreEl = document.getElementById('final-score');
  const bestScoreEl = document.getElementById('best-score');
  const newBadge = document.getElementById('new-badge');
  const medalEl = document.getElementById('medal');
  const overTitle = document.getElementById('over-title');
  const scorePanel = document.getElementById('score-panel');
  const priceNote = document.getElementById('price-note');
  const restartBtn = document.getElementById('restart-btn');
  const payBtn = document.getElementById('pay-btn');
  const payPrice = document.getElementById('pay-price');
  const creditPill = document.getElementById('credit-pill');
  const creditText = document.getElementById('credit-text');
  const muteBtn = document.getElementById('mute-btn');
  const toastEl = document.getElementById('toast');

  // ===== World =====
  const W = 288;
  let H = 512;
  let GROUND_Y = 400;
  const PIPE_W = 52;
  const CAP_W = 58;
  const CAP_H = 24;
  const PIPE_SPACING = 168;
  const SPEED = 2;
  const GRAVITY = 0.3;
  const FLAP = -5.4;
  const MAX_FALL = 9;
  const R = 12;
  const PX = 80;
  const TAU = Math.PI * 2;

  let scale = 1;
  let layers = {};

  const store = {
    get(k, d) { try { const v = localStorage.getItem('fp_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('fp_' + k, JSON.stringify(v)); } catch (e) {} },
  };

  let best = store.get('best', 0);
  let muted = store.get('muted', false);

  let state = 'ready';
  let tick = 0;
  let scroll = 0;
  let score = 0;
  let hasTicket = true;
  let busy = false;
  let wallet = { credits: 0, freeAvailable: true, price: 10, nextPrice: 20 };
  let invuln = 0;
  let flash = 0;
  let shake = 0;
  let deadTimer = 0;
  let pipes = [];
  let particles = [];
  let floats = [];
  const p = { y: 200, vy: 0, rot: 0, wing: 0 };
  const skyClouds = [
    { x: 30, y: 0.12, s: 1 }, { x: 170, y: 0.22, s: 0.7 }, { x: 250, y: 0.08, s: 0.85 },
  ];

  // ===== Sizing =====
  function resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    H = Math.round(Math.min(620, Math.max(480, (W * vh) / vw)));
    GROUND_Y = H - 112;
    let cssH = vh;
    let cssW = (cssH * W) / H;
    if (cssW > vw) { cssW = vw; cssH = (cssW * H) / W; }
    stage.style.width = cssW + 'px';
    stage.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    scale = canvas.width / W;
    buildLayers();
    if (state === 'ready') p.y = readyY();
  }

  function seeded(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeLayer(draw) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(W * scale);
    c.height = Math.ceil(H * scale);
    const g = c.getContext('2d');
    g.scale(scale, scale);
    draw(g);
    return c;
  }

  const wrapDraw = (fn, x) => { fn(x); if (x < 40) fn(x + W); if (x > W - 40) fn(x - W); };

  function buildLayers() {
    layers.clouds = makeLayer((g) => {
      const rnd = seeded(7);
      const base = GROUND_Y - 78;
      g.fillStyle = '#d9f1ee';
      for (let x = 0; x < W; x += 16 + rnd() * 12) {
        const r = 16 + rnd() * 14; const cy = base + 6 + rnd() * 8;
        wrapDraw((cx) => { g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill(); }, x);
      }
      g.fillStyle = '#ffffff';
      for (let x = 0; x < W; x += 18 + rnd() * 14) {
        const r = 14 + rnd() * 14; const cy = base + 12 + rnd() * 8;
        wrapDraw((cx) => { g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill(); }, x);
      }
      g.fillRect(0, base + 16, W, GROUND_Y - base);
    });

    layers.city = makeLayer((g) => {
      const rnd = seeded(21);
      const base = GROUND_Y - 16;
      for (let x = 0; x < W;) {
        const bw = 18 + Math.floor(rnd() * 18);
        const bh = 22 + Math.floor(rnd() * 46);
        const tone = rnd() > 0.5 ? '#b6e3c4' : '#a7dbb8';
        const bx = x;
        wrapDraw((cx) => {
          g.fillStyle = tone;
          g.fillRect(cx, base - bh, bw, bh + 16);
          g.fillStyle = '#93cda5';
          g.fillRect(cx, base - bh, bw, 2);
          g.fillStyle = '#d6f2de';
          for (let wy = base - bh + 6; wy < base - 4; wy += 8) {
            for (let wx = cx + 4; wx < cx + bw - 4; wx += 6) g.fillRect(wx, wy, 3, 4);
          }
        }, bx);
        x += bw - 2;
      }
    });

    layers.bushes = makeLayer((g) => {
      const rnd = seeded(42);
      const base = GROUND_Y - 4;
      g.fillStyle = '#3fae4a';
      for (let x = 0; x < W; x += 12 + rnd() * 10) {
        const r = 12 + rnd() * 10;
        wrapDraw((cx) => { g.beginPath(); g.arc(cx, base - 4, r + 1.5, 0, TAU); g.fill(); }, x);
      }
      g.fillStyle = '#5ccf5c';
      const rnd2 = seeded(42);
      for (let x = 0; x < W; x += 12 + rnd2() * 10) {
        const r = 12 + rnd2() * 10;
        wrapDraw((cx) => { g.beginPath(); g.arc(cx, base - 4, r, 0, TAU); g.fill(); }, x);
      }
      g.fillRect(0, base - 4, W, 10);
    });
  }

  const readyY = () => GROUND_Y * 0.5;

  // ===== Audio Web API =====
  let actx = null;
  function ensureAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    }
    if (actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur, type = 'sine', vol = 0.12, slideTo = null, delay = 0) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator();
    const gn = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gn.gain.setValueAtTime(vol, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol = 0.1, freq = 1500, delay = 0) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const len = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq;
    const gn = actx.createGain(); gn.gain.value = vol;
    src.connect(f).connect(gn).connect(actx.destination);
    src.start(t0);
  }
  const sfx = {
    flap() { tone(480, 0.09, 'triangle', 0.07, 760); noise(0.08, 0.05, 2400); },
    point() { tone(988, 0.07, 'square', 0.04); tone(1319, 0.14, 'square', 0.04, null, 0.07); },
    star() { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.12, 'sine', 0.08, null, i * 0.05)); },
    hit() { noise(0.25, 0.3, 700); tone(200, 0.25, 'sawtooth', 0.08, 60); },
    die() { tone(620, 0.45, 'triangle', 0.08, 140, 0.18); },
    swoosh() { noise(0.25, 0.08, 900); },
    revive() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.15, 'triangle', 0.08, null, i * 0.07)); },
  };

  function updateMuteUI() {
    document.getElementById('icon-sound').style.display = muted ? 'none' : '';
    document.getElementById('icon-mute').style.display = muted ? '' : 'none';
    muteBtn.setAttribute('aria-label', muted ? 'Bật âm thanh' : 'Tắt âm thanh');
  }
  updateMuteUI();

  // ===== Game Flow =====
  function resetToReady() {
    state = 'ready';
    pipes = []; particles = []; floats = [];
    score = 0; invuln = 0; flash = 0; shake = 0;
    p.y = readyY(); p.vy = 0; p.rot = 0;
    overEl.classList.remove('show');
    overEl.setAttribute('aria-hidden', 'true');
  }

  function startPlaying() {
    state = 'playing';
    pipes = [];
    spawnPipe(W + 90);
  }

  function flap() {
    p.vy = FLAP;
    sfx.flap();
    haptic('light');
    for (let i = 0; i < 3; i++) {
      particles.push({ x: PX - 12, y: p.y + 4, vx: -1 - Math.random(), vy: Math.random() * 1.5 - 0.5, life: 22, max: 22, size: 2 + Math.random() * 2, color: '#ffffff' });
    }
  }

  function spawnPipe(x) {
    const gap = Math.max(102, 124 - score * 0.7);
    const margin = 56;
    const gapY = margin + gap / 2 + Math.random() * (GROUND_Y - margin * 2 - gap);
    pipes.push({ x, gapY, gap, passed: false });
  }

  function hit() {
    state = 'dying';
    flash = 1;
    shake = 10;
    p.vy = Math.min(p.vy, -1);
    deadTimer = 0;
    sfx.hit();
    sfx.die();
    haptic('error');
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * TAU;
      particles.push({ x: PX, y: p.y, vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5 - 1, life: 40, max: 40, size: 3, color: i % 2 ? '#1d2538' : '#f5f8ff' });
    }
  }

  function medalFor(s) {
    if (s >= 40) return ['platinum', 'Huy chương bạch kim'];
    if (s >= 30) return ['gold', 'Huy chương vàng'];
    if (s >= 20) return ['silver', 'Huy chương bạc'];
    if (s >= 10) return ['bronze', 'Huy chương đồng'];
    return [null, 'Chưa có huy chương'];
  }

  function hasFreePlay() { return false; }

  function renderWallet() {
    const free = hasFreePlay();
    restartBtn.hidden = !free;
    payBtn.hidden = free;
    payPrice.textContent = wallet.price;
    restartBtn.disabled = payBtn.disabled = busy;
    creditPill.hidden = !inTelegram || wallet.credits <= 0;
    creditText.textContent = `${wallet.credits} lượt`;
    
    if (!inTelegram) priceNote.textContent = 'Chế độ chơi thử (Giao diện Web ngoài Telegram)';
    else if (wallet.credits > 0) priceNote.textContent = `Bạn còn ${wallet.credits} lượt đã mua`;
    else if (wallet.freeAvailable) priceNote.textContent = 'Lượt miễn phí hôm nay';
    else priceNote.textContent = `Lượt sau: ${wallet.nextPrice} Stars (Giá đặt lại mỗi ngày)`;
  }

  function applyWallet(d) {
    if (!d || typeof d.price !== 'number') return;
    wallet = { credits: d.credits, freeAvailable: d.freeAvailable, price: d.price, nextPrice: d.nextPrice };
    if (d.best > best) { best = d.best; store.set('best', best); }
    renderWallet();
  }

  function openOverlay(paywall) {
    overTitle.textContent = paywall ? 'HẾT LƯỢT CHƠI' : 'GAME OVER';
    scorePanel.hidden = paywall;
    renderWallet();
    overEl.classList.add('show');
    overEl.setAttribute('aria-hidden', 'false');
  }

  function showOver() {
    state = 'over';
    hasTicket = !inTelegram;
    const isNew = score > best;
    if (isNew) { best = score; store.set('best', best); }
    if (inTelegram) api('score', { score }).then(() => api('status')).then((r) => applyWallet(r.data)).catch(() => {});
    const [tier, label] = medalFor(score);
    if (tier) medalEl.dataset.tier = tier; else delete medalEl.dataset.tier;
    medalEl.setAttribute('aria-label', label);
    bestScoreEl.textContent = best;
    newBadge.hidden = !isNew;
    finalScoreEl.textContent = '0';
    openOverlay(false);
    sfx.swoosh();
    const target = score;
    const startAt = performance.now() + 550;
    const count = (now) => {
      if (state !== 'over') return;
      const k = Math.min(1, Math.max(0, (now - startAt) / 600));
      finalScoreEl.textContent = Math.round(target * k);
      if (k < 1) requestAnimationFrame(count);
    };
    requestAnimationFrame(count);
    setTimeout(() => { if (state === 'over') (payBtn.hidden ? restartBtn : payBtn).focus({ preventScroll: true }); }, 800);
  }

  function setBusy(v) { busy = v; renderWallet(); }

  async function acquireTicket() {
    if (!inTelegram) return true;
    const r = await api('start');
    applyWallet(r.data);
    if (r.status === 200 && r.data.ok) return true;
    if (r.status === 402) return false;
    return true; // Cho phép chơi tiếp nếu backend cấu hình linh hoạt
  }

  async function tryPlayAgain() {
    if (busy) return;
    setBusy(true);
    try {
      if (await acquireTicket()) {
        hasTicket = true;
        sfx.swoosh();
        resetToReady();
      } else {
        state = 'over';
        openOverlay(true);
      }
    } catch (e) {
      showToast('Thử lại nhé!');
    } finally {
      setBusy(false);
    }
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Tích hợp thanh toán Telegram Stars
  async function buyReplay() {
    if (busy) return;
    
    // Nếu chạy ngoài Telegram -> Giả lập mua Stars
    if (!inTelegram || typeof tg.openInvoice !== 'function') {
      showToast('Mô phỏng: Đã nạp thành công 10 Stars!');
      sfx.revive();
      hasTicket = true;
      resetToReady();
      return;
    }

    setBusy(true);
    try {
      const r = await api('invoice');
      if (!r.data?.link) throw new Error(r.data?.error || 'invoice_failed');
      
      // Gọi giao diện mua hàng chuẩn Telegram
      const status = await new Promise((resolve) => tg.openInvoice(r.data.link, resolve));
      if (status === 'paid') {
        for (let i = 0; i < 10; i++) {
          if (await acquireTicket()) {
            hasTicket = true;
            sfx.revive();
            haptic('success');
            showToast(`Đã thanh toán ${r.data.price || 10} Stars thành công!`);
            resetToReady();
            return;
          }
          await sleep(800);
        }
        showToast('Đang xác nhận thanh toán...');
      } else if (status === 'failed') {
        haptic('error');
        showToast('Thanh toán không thành công');
      }
    } catch (e) {
      showToast('Không khởi tạo được hóa đơn Telegram Stars');
    } finally {
      setBusy(false);
    }
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  // ===== Physics & Collision =====
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function circRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw); const ny = clamp(cy, ry, ry + rh);
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  }

  function update() {
    tick++;
    if (state === 'ready' || state === 'playing') scroll += SPEED;

    if (state === 'ready') {
      p.y = readyY() + Math.sin(tick * 0.08) * 6;
      p.rot = 0;
      p.wing += 0.28;
    } else if (state === 'playing') {
      p.vy = Math.min(p.vy + GRAVITY, MAX_FALL);
      p.y += p.vy;
      if (p.y < -30) { p.y = -30; p.vy = 0; }
      p.rot = p.vy < 2 ? Math.max(p.rot - 0.15, -0.42) : Math.min(p.rot + 0.07, 1.45);
      p.wing += p.vy < 0 ? 0.6 : 0.25;
      if (invuln > 0) invuln--;

      const last = pipes[pipes.length - 1];
      if (!last || last.x < W - PIPE_SPACING) spawnPipe(W + 10);

      for (let i = pipes.length - 1; i >= 0; i--) {
        const pp = pipes[i];
        pp.x -= SPEED;
        const top = pp.gapY - pp.gap / 2;
        const bot = pp.gapY + pp.gap / 2;

        if (!pp.passed && pp.x + PIPE_W < PX) {
          pp.passed = true; score++; sfx.point();
        }
        if (invuln <= 0) {
          const capX = pp.x - (CAP_W - PIPE_W) / 2;
          if (
            circRect(PX, p.y, R, pp.x, -200, PIPE_W, top + 200) ||
            circRect(PX, p.y, R, capX, top - CAP_H, CAP_W, CAP_H) ||
            circRect(PX, p.y, R, pp.x, bot, PIPE_W, H) ||
            circRect(PX, p.y, R, capX, bot, CAP_W, CAP_H)
          ) { hit(); break; }
        }
        if (pp.x < -CAP_W - 10) pipes.splice(i, 1);
      }

      if (state === 'playing' && p.y + R >= GROUND_Y) { p.y = GROUND_Y - R; hit(); }
    } else if (state === 'dying') {
      if (p.y + R < GROUND_Y) {
        p.vy = Math.min(p.vy + GRAVITY * 1.3, MAX_FALL + 3);
        p.y = Math.min(p.y + p.vy, GROUND_Y - R);
        p.rot = Math.min(p.rot + 0.14, Math.PI / 2);
      } else if (++deadTimer > 30) {
        showOver();
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.x += q.vx; q.y += q.vy; q.vy += 0.08; q.vx *= 0.97;
      if (--q.life <= 0) particles.splice(i, 1);
    }
    flash = Math.max(0, flash - 0.06);
    shake = Math.max(0, shake - 0.6);
    for (const c of skyClouds) {
      if (state === 'ready' || state === 'playing') c.x -= 0.15 * c.s;
      if (c.x < -60) c.x = W + 40;
    }
  }

  // ===== Render Graphic =====
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, '#3fb4c4');
    g.addColorStop(0.6, '#62cbd3');
    g.addColorStop(1, '#a6e4e4');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND_Y);
    const sun = ctx.createRadialGradient(W - 60, 70, 4, W - 60, 70, 70);
    sun.addColorStop(0, 'rgba(255,250,210,0.95)');
    sun.addColorStop(0.25, 'rgba(255,245,190,0.55)');
    sun.addColorStop(1, 'rgba(255,245,190,0)');
    ctx.fillStyle = sun;
    ctx.fillRect(W - 140, 0, 140, 150);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (const c of skyClouds) {
      const y = GROUND_Y * c.y + 20; const s = c.s;
      ctx.beginPath();
      ctx.arc(c.x, y, 10 * s, 0, TAU);
      ctx.arc(c.x + 13 * s, y - 6 * s, 13 * s, 0, TAU);
      ctx.arc(c.x + 28 * s, y, 10 * s, 0, TAU);
      ctx.fill();
      ctx.fillRect(c.x, y, 28 * s, 10 * s);
    }
  }

  function drawLayer(img, factor) {
    const off = (scroll * factor) % W;
    ctx.drawImage(img, -off, 0, W, H);
    ctx.drawImage(img, W - off - 0.5, 0, W, H);
  }

  function pipeGradient(x, w) {
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#558022');
    g.addColorStop(0.1, '#9ce659');
    g.addColorStop(0.3, '#8bd94a');
    g.addColorStop(0.7, '#73bf2e');
    g.addColorStop(0.9, '#5e9e24');
    g.addColorStop(1, '#4a7d1c');
    return g;
  }

  function drawPipe(pp) {
    const top = pp.gapY - pp.gap / 2;
    const bot = pp.gapY + pp.gap / 2;
    const capX = pp.x - (CAP_W - PIPE_W) / 2;
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#2e3d14';

    ctx.fillStyle = pipeGradient(pp.x, PIPE_W);
    ctx.fillRect(pp.x, -2, PIPE_W, top - CAP_H + 2);
    ctx.strokeRect(pp.x, -2, PIPE_W, top - CAP_H + 2);
    ctx.fillRect(pp.x, bot + CAP_H, PIPE_W, GROUND_Y - bot - CAP_H + 2);
    ctx.strokeRect(pp.x, bot + CAP_H, PIPE_W, GROUND_Y - bot - CAP_H + 2);

    ctx.fillStyle = pipeGradient(capX, CAP_W);
    roundRect(capX, top - CAP_H, CAP_W, CAP_H, 3); ctx.fill(); ctx.stroke();
    roundRect(capX, bot, CAP_W, CAP_H, 3); ctx.fill(); ctx.stroke();

    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(pp.x + 1, top - CAP_H - 5, PIPE_W - 2, 4);
    ctx.fillRect(pp.x + 1, bot + CAP_H + 1, PIPE_W - 2, 4);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawGround() {
    const gy = GROUND_Y;
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = '#2e3d14';
    ctx.fillRect(0, gy, W, 2);
    ctx.fillStyle = '#73bf2e';
    ctx.fillRect(0, gy + 2, W, 12);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, gy + 2, W, 12); ctx.clip();
    ctx.fillStyle = '#9ce659';
    const off = scroll % 14;
    for (let x = -off - 14; x < W + 14; x += 14) {
      ctx.beginPath();
      ctx.moveTo(x, gy + 14); ctx.lineTo(x + 7, gy + 14); ctx.lineTo(x + 14, gy + 2); ctx.lineTo(x + 7, gy + 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#558022';
    ctx.fillRect(0, gy + 14, W, 3);
    ctx.fillStyle = '#c9c27a';
    ctx.fillRect(0, gy + 17, W, 4);
  }

  function ell(x, y, rx, ry, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, r, 0, TAU); }

  function drawPenguin(x, y, rot, wing) {
    const ol = '#0d1220';
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    ctx.fillStyle = '#ff9f1c'; ctx.strokeStyle = '#8a4a00'; ctx.lineWidth = 1.5;
    ell(-4, 14, 5, 2.8, 0.2); ctx.fill(); ctx.stroke();
    ell(5, 14, 5, 2.8, -0.1); ctx.fill(); ctx.stroke();

    const flutter = Math.sin(tick * 0.4) * 2;
    ctx.fillStyle = '#c81d35'; ctx.strokeStyle = ol; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-10, 3);
    ctx.quadraticCurveTo(-18, 2 + flutter, -24, 4 + flutter);
    ctx.lineTo(-22, 10 + flutter);
    ctx.quadraticCurveTo(-16, 9, -10, 8);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    const body = ctx.createRadialGradient(-5, -7, 2, 0, 0, 20);
    body.addColorStop(0, '#46557a');
    body.addColorStop(1, '#1a2236');
    ctx.fillStyle = body;
    ell(0, 0, 16, 15); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = ol; ctx.stroke();

    ctx.fillStyle = '#f5f8ff';
    ell(5, 5, 10, 9.5); ctx.fill();

    ctx.fillStyle = '#fff'; ctx.strokeStyle = ol; ctx.lineWidth = 1.5;
    ell(8.5, -5.5, 4.6, 4.8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = ol;
    ell(10, -5.2, 2.4, 2.7); ctx.fill();
    ctx.fillStyle = '#fff';
    ell(10.8, -6.3, 0.9, 0.9); ctx.fill();

    ctx.fillStyle = '#ffb627'; ctx.strokeStyle = '#8a4a00'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(12.5, -3);
    ctx.quadraticCurveTo(21, -2, 23, 0.5);
    ctx.quadraticCurveTo(19, 2.5, 13, 2);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.save();
    ctx.translate(-5, 0);
    ctx.rotate(Math.sin(wing) * 0.75 - 0.15);
    ctx.fillStyle = '#28324c'; ctx.strokeStyle = ol; ctx.lineWidth = 1.5;
    ell(-6, 3, 9, 4.6, 0.25); ctx.fill(); ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function outlinedText(text, x, y, size, fill, stroke = '#1a2236') {
    ctx.font = `800 ${size}px "Baloo 2", "Arial Black", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.lineWidth = size / 3.2;
    ctx.strokeText(text, x, y + 2);
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawReady() {
    const ty = GROUND_Y * 0.17;
    const wob = Math.sin(tick * 0.05) * 2;
    outlinedText('FLAPPY', W / 2, ty + wob, 40, '#ffd23f', '#3b2412');
    outlinedText('PENGUIN', W / 2, ty + 38 + wob, 40, '#ffffff', '#1a2236');
    outlinedText('Chuẩn bị!', W / 2, GROUND_Y * 0.36, 28, '#7ee04a', '#2e3d14');

    const hy = readyY() + 48;
    ctx.fillStyle = 'rgba(20,30,50,0.6)';
    roundRect(W / 2 - 70, hy, 140, 28, 14); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '800 15px "Baloo 2", "Arial Black", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('CHẠM ĐỂ BAY', W / 2, hy + 15);

    if (best > 0) outlinedText(`Kỷ lục: ${best}`, W / 2, GROUND_Y + 60, 18, '#ffffff', '#3b2412');
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawSky();
    drawLayer(layers.clouds, 0.1);
    drawLayer(layers.city, 0.25);
    drawLayer(layers.bushes, 0.5);

    for (const pp of pipes) drawPipe(pp);

    drawGround();

    for (const q of particles) {
      ctx.globalAlpha = q.life / q.max;
      ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawPenguin(PX, p.y, p.rot, p.wing);

    if (state === 'ready') drawReady();
    else if (state === 'playing' || state === 'dying') outlinedText(String(score), W / 2, 62, 52, '#ffffff', '#1a2236');

    if (flash > 0) {
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.fillStyle = `rgba(255,255,255,${flash})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ===== Loop Engine =====
  const STEP = 1000 / 60;
  let last = performance.now();
  let acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    render();
    requestAnimationFrame(loop);
  }

  // ===== Event Listeners =====
  function press() {
    ensureAudio();
    if (state === 'ready') {
      if (hasTicket) { startPlaying(); flap(); return; }
      if (busy) return;
      setBusy(true);
      acquireTicket()
        .then((ok) => {
          if (ok) { hasTicket = true; if (state === 'ready') { startPlaying(); flap(); } }
          else { state = 'over'; openOverlay(true); }
        })
        .catch(() => showToast('Thử lại nhé!'))
        .finally(() => setBusy(false));
    }
    else if (state === 'playing') flap();
  }

  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button') || e.target.closest('#over')) return;
    e.preventDefault();
    press();
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (state === 'over') return;
      e.preventDefault();
      press();
    }
  });
  restartBtn.addEventListener('click', () => { ensureAudio(); tryPlayAgain(); });
  payBtn.addEventListener('click', () => { ensureAudio(); buyReplay(); });
  muteBtn.addEventListener('click', () => {
    muted = !muted; store.set('muted', muted); updateMuteUI();
    if (!muted) { ensureAudio(); tone(880, 0.08, 'sine', 0.06); }
  });
  window.addEventListener('resize', resize);

  resize();
  resetToReady();
  renderWallet();
  if (inTelegram) api('status').then((r) => applyWallet(r.data)).catch(() => {});
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
